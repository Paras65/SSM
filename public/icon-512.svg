<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="250" fill="url(#grad)" stroke="url(#gold)" stroke-width="12"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#fed7aa" stroke-width="3" stroke-dasharray="8 6"/>
  
  <!-- Sacred Om Symbol Top -->
  <text x="256" y="115" font-family="serif" font-size="44" font-weight="bold" fill="url(#gold)" text-anchor="middle">ॐ</text>

  <!-- Central Lotus & Veena Motif -->
  <g transform="translate(256, 260) scale(1.4)">
    <!-- Outer Lotus Petals -->
    <path d="M0,45 C-40,20 -70,-20 -50,-60 C-30,-20 -10,-10 0,45 Z" fill="#fed7aa" opacity="0.9"/>
    <path d="M0,45 C40,20 70,-20 50,-60 C30,-20 10,-10 0,45 Z" fill="#fed7aa" opacity="0.9"/>
    <path d="M0,45 C-60,30 -90,0 -80,-30 C-50,-10 -20,10 0,45 Z" fill="#fdba74" opacity="0.8"/>
    <path d="M0,45 C60,30 90,0 80,-30 C50,-10 20,10 0,45 Z" fill="#fdba74" opacity="0.8"/>
    
    <!-- Central Main Petal -->
    <path d="M0,45 C-30,0 -40,-60 0,-85 C40,-60 30,0 0,45 Z" fill="#ffffff"/>
    
    <!-- Inner Flame / Diya Core -->
    <path d="M0,25 C-15,10 -20,-20 0,-40 C20,-20 15,10 0,25 Z" fill="url(#gold)"/>
    <circle cx="0" cy="-10" r="8" fill="#ea580c"/>
  </g>

  <!-- Banner & Text -->
  <text x="256" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    सरस्वती शिशु मंदिर
  </text>
  <text x="256" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="3">
    VIDYA BHARATI
  </text>
  <text x="256" y="445" font-family="serif" font-size="16" font-style="italic" fill="#fed7aa" text-anchor="middle">
    "सा विद्या या विमुक्तये"
  </text>
</svg>

